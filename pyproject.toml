[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astronomy_research_team16"
version = "0.1.0"
authors = [
  { name="Shuxin Dong", email="shuxind11@gmail.com" },
  { name="Cyrus Ayubcha", email="cyrusayubcha@hms.harvard.edu" },
  { name="Lina Wang", email="lwang2@g.harvard.edu" },
  { name="Yu Yan", email="yuyan@hsph.harvard.edu"},
  { name="Nancy Zha", email="nzha@hsph.harvard.edu"},
]
description = "Astronomy Research API"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://code.harvard.edu/CS107/team16_2023"
"Bug Tracker" = "https://code.harvard.edu/CS107/team16_2023/issues"