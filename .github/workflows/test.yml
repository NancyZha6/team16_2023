name: project test

on:
  push:
    branches:
      - data-preprocessing
  pull_requests:
    branches:
      - dev

jobs:
    test_data_preprocessing:
      name: Test first module data preprocessing
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3
        - uses: actions/setup-python@v3 
          with:
            python-version: '3.10' # let's use a recent version
        - name: Install Python dependencies 
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
        - name: Set PYTHONPATH
          run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
        - name: Run data preprocessing module test files
          run: |
            pytest tests/test_data_preprocessing.py
    test_metadata_extractor:
      name: Test module MetadataExtractor
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3
        - uses: actions/setup-python@v3 
          with:
            python-version: '3.10' # let's use a recent version
        - name: Install Python dependencies 
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
        - name: Set PYTHONPATH
          run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
        - name: Run metadata extractor module test files
          run: |
            pytest tests/test_metadata_extractor.py
