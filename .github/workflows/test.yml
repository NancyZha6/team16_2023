name: project test

on:
  push:
    branches:
      - data-preprocessing

jobs:
    test_data_preprocessing:
    name: Test first module data preprocessing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3 
        with:
          python-version: '3.10' # let's use a recent version
      - name: Install Python dependencies 
        run: |
          python -m pip install --upgrade pip
          pip install -r workflows_repo/requirements.txt
      - name: Run data preprocessing module test files
        run: |
          pytest docs/milestone4/test_data_preprocessing.py
