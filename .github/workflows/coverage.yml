name: Test Coverage

on:
  pull_request:
    branches:
      - dev

jobs:
    coverate_unit_test:
      name: Test coverage for unit tests
      runs-on: ${{ fromJSON('["ubuntu-latest", "self-hosted"]')[github.repository == 'github/docs-internal'] }}
      steps:
        - uses: actions/checkout@v3
        - uses: actions/setup-python@v3 
          with:
            python-version: '3.10'
        - name: Install Python dependencies 
          run: |
            python -m pip install --upgrade pip
            pip install -r tests/requirements.txt
            pip install pytest pytest-cov
        - name: Set PYTHONPATH
          run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
        - name: Run tests with coverage
          run: |
            pytest --cov=. tests/test_data_query.py
            pytest --cov=. tests/test_data_preprocessing.py
            pytest --cov=. tests/test_metadata_extraction.py
            pytest --cov=. tests/test_wavelength_alignment.py
            pytest --cov=. tests/test_data_augmentation.py
            pytest --cov=. tests/test_machine_learning.py
            pytest --cov=. tests/test_spectral_feature_extraction.py
            pytest --cov=. tests/test_visualization.py
