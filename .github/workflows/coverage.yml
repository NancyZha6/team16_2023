name: Test Coverage

on:
  push:
    branches:
      - data-preprocessing

jobs:
    coverage_data_preprocessing:
      name: Test coverage for first module data preprocessing
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3
        - uses: actions/setup-python@v3 
          with:
            python-version: '3.10' # let's use a recent version
        - name: Install Python dependencies 
          run: |
            python -m pip install --upgrade pip
            pip install -r tests/requirements.txt
            pip install pytest pytest-cov
        - name: Set PYTHONPATH
          run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
        - name: Run tests with coverage
          run: |
            pytest --cov=. tests/test_data_preprocessing.py
            pytest --cov=. tests/test_metadata_extractor.py
            pytest --cov=. tests/test_wavelength_alignment.py
            pytest --cov=. tests/test_data_augmentation.py
